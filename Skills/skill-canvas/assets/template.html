<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill Builder Visualizer</title>
<style>
:root {
  --bg: #f4f5f8; --dot: #d9dde6; --panel: #ffffff; --ink: #1c2330; --muted: #667085; --line: #d5dae3;
  --accent: #3b5bdb; --accent-soft: #e7ecff; --ok: #2b8a3e; --skip: #98a1b3;
  --par: #b45f06; --par-soft: #fff4e5; --dyn: #7048e8; --dyn-soft: #f1ebff; --err: #c92a2a;
  --out: #0b7285; --out-soft: #e3fafc;
  --shadow: 0 1px 2px rgba(16,24,40,.08), 0 4px 12px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151c; --dot: #262c3a; --panel: #1b202b; --ink: #e8ebf2; --muted: #9aa3b5; --line: #323a4b;
    --accent: #8ba2ff; --accent-soft: #232c4d; --ok: #69db7c; --skip: #5c6579;
    --par: #ffc078; --par-soft: #2e2418; --dyn: #b197fc; --dyn-soft: #272040; --err: #ff8787;
    --out: #66d9e8; --out-soft: #12303a; --shadow: 0 1px 2px rgba(0,0,0,.4);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { margin: 0; font-size: 17px; }
header p { margin: 0; color: var(--muted); flex: 1 1 260px; }
#agentbar { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-wrap: wrap; }
.pill { font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.pill[data-s="needs-review"] { background: var(--par-soft); color: var(--par); border-color: var(--par); }
.pill[data-s="enhanced"] { background: var(--dyn-soft); color: var(--dyn); border-color: var(--dyn); }
.pill[data-s="approved"] { background: var(--out-soft); color: var(--out); border-color: var(--out); }
.act { font: inherit; font-size: 13px; padding: 4px 12px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
.act.ghost { background: none; color: var(--accent); }
.act:disabled { opacity: .45; cursor: not-allowed; }
.act:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
#banner { display: none; padding: 8px 16px; background: var(--err); color: #fff; font-size: 13px; }
#stage { flex: 1; position: relative; min-height: 0; }
#board {
  position: absolute; inset: 0; overflow: hidden; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
  background-image: radial-gradient(var(--dot) 1px, transparent 1px); background-size: 20px 20px;
}
#board.panning { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
#chart { position: absolute; left: 0; top: 0; }
#chart svg { position: absolute; inset: 0; pointer-events: none; }
#zoomctl { position: absolute; right: 14px; bottom: 14px; display: flex; gap: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; box-shadow: var(--shadow); z-index: 5; }
#zoomctl button { font: inherit; min-width: 32px; height: 30px; padding: 0 8px; border: 0; background: none; color: var(--ink); border-radius: 7px; cursor: pointer; }
#edittools { position: absolute; left: 14px; bottom: 14px; display: flex; align-items: center; gap: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; box-shadow: var(--shadow); z-index: 5; }
#edittools[hidden] { display: none; }
@media (max-width: 600px) { #edittools { max-width: calc(100% - 28px); overflow-x: auto; } #edittools button { white-space: nowrap; } }
#edittools button { font: inherit; height: 30px; padding: 0 10px; border: 0; background: none; color: var(--ink); border-radius: 7px; cursor: pointer; }
#edittools button:hover:not(:disabled) { background: var(--accent-soft); }
#edittools button:disabled { opacity: .35; cursor: default; }
#edittools button:focus-visible { outline: 2px solid var(--accent); }
#edittools .hint { padding: 0 8px; min-width: 0; }
#edittools #addStep { color: var(--accent); font-weight: 700; }
@media (hover: none) { .editable .port { opacity: .7; } }
.port { display: none; position: absolute; top: 50%; width: 12px; height: 12px; margin-top: -6px; border-radius: 50%; background: var(--panel); border: 2px solid var(--accent); opacity: 0; transition: opacity .15s; }
.editable .port { display: block; }
.node:hover .port, .node.selected .port { opacity: 1; }
.port.in { left: -7px; border-color: var(--skip); pointer-events: none; }
.port.out { right: -7px; cursor: crosshair; }
.edge-hit { fill: none; stroke: transparent; stroke-width: 16; pointer-events: stroke; }
.edel { display: none; pointer-events: all; cursor: pointer; }
.edge:hover .edel { display: block; }
.edel circle { fill: var(--panel); stroke: var(--err); stroke-width: 1.5; }
.edel text { fill: var(--err); font-size: 14px; font-weight: 700; }
.editable .node { cursor: grab; }
#sheet label.f { display: block; margin: 10px 0 0; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
#sheet input[type=text], #sheet textarea, #sheet select { display: block; width: 100%; margin-top: 3px; font: inherit; font-size: 13px; font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
#sheet textarea { resize: vertical; }
#sheet input:focus-visible, #sheet textarea:focus-visible, #sheet select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.chipx { font: inherit; font-size: 13px; line-height: 1; padding: 0 2px; margin-left: 2px; border: 0; background: none; color: var(--err); cursor: pointer; border-radius: 4px; }
.chipx:hover { background: var(--bg); }
.act.danger { border-color: var(--err); background: none; color: var(--err); }
.node.multi { box-shadow: 0 0 0 3px var(--par-soft), 0 0 0 5px var(--par); }
#topbars { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 6; display: flex; flex-direction: column; align-items: center; gap: 8px; max-width: calc(100% - 24px); }
#revbar { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--panel); border: 1px solid var(--dyn); border-radius: 12px; box-shadow: var(--shadow); flex-wrap: wrap; }
#revbar[hidden] { display: none; }
.node.chg-added { border-color: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent), var(--shadow); }
.node.chg-modified { border-color: var(--par); box-shadow: 0 0 0 3px var(--par-soft), var(--shadow); }
.rbadge { position: absolute; top: -9px; left: 12px; font-size: 10px; font-weight: 700; font-style: normal; padding: 0 7px; border-radius: 999px; color: #fff; }
.rbadge.added { background: var(--ok); }
.rbadge.modified { background: var(--par); }
.chg { margin-top: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; }
.chghead { display: flex; align-items: center; gap: 8px; }
.rtag { font-size: 10px; font-weight: 700; padding: 0 7px; border-radius: 999px; color: #fff; }
.rtag.added { background: var(--ok); } .rtag.modified { background: var(--par); } .rtag.removed { background: var(--err); }
.chg .fld { margin-top: 6px; font-size: 13px; overflow-wrap: anywhere; }
.chg .fld small { display: block; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-size: 10px; }
.chg .old { color: var(--muted); text-decoration: line-through; }
.chg .btns { margin-top: 8px; }
.chg .btns .act { margin-right: 6px; }
#selbar { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--panel); border: 1px solid var(--par); border-radius: 12px; box-shadow: var(--shadow); flex-wrap: wrap; }
#selbar[hidden] { display: none; }
.hodetails summary { cursor: pointer; margin-top: 10px; color: var(--accent); font-size: 13px; }
#sheet textarea[readonly] { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
.ftree { list-style: none; margin: 8px 0 0; padding: 0; font-size: 13px; }
.ftree li { padding: 2px 0; }
.ftree button { font: inherit; border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; text-align: left; }
.ftree button:hover { text-decoration: underline; }
.ftree .dir { font-weight: 700; color: var(--muted); }
.ftree .sz { color: var(--muted); font-size: 11px; margin-left: 6px; }
.fhead { margin-top: 12px; font-weight: 700; font-size: 13px; overflow-wrap: anywhere; }
#filePreview pre { margin: 6px 0 0; padding: 10px; max-height: 360px; overflow: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
.warn.soft { border-color: var(--par); background: var(--par-soft); }
.lane-label.bad { color: var(--err); }
.newin { margin-top: 8px; padding: 10px; border: 1px dashed var(--dyn); border-radius: 10px; background: var(--dyn-soft); }
.newin .act { margin: 8px 6px 0 0; }
.clause { position: relative; display: grid; gap: 6px; margin-top: 6px; padding: 8px 28px 8px 8px; border: 1px solid var(--line); border-radius: 8px; }
.clause select { margin-top: 0 !important; }
.clause .chipx { position: absolute; top: 6px; right: 6px; font-size: 16px; }
.ckset { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.ck { font-size: 13px; cursor: pointer; }
.inp { margin-top: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; }
.inprow, .optrow { display: flex; align-items: center; gap: 8px; }
.optrow { margin-top: 6px; }
.inprow input[type=text], .optrow input[type=text] { flex: 1; margin-top: 0 !important; }
.tag { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.tag.dyn { background: var(--dyn-soft); color: var(--dyn); border-color: var(--dyn); }
.warn { margin-top: 8px; padding: 8px 10px; border: 1px solid var(--err); border-radius: 8px; font-size: 13px; }
.warn .act { margin: 6px 6px 0 0; }
.ferr { margin-top: 3px; font-size: 12px; color: var(--err); }
#sheet input[aria-invalid=true] { border-color: var(--err); }
@media (max-width: 600px) { #zoomctl { bottom: 58px; } }
#zoomctl button:hover { background: var(--accent-soft); }
#zoomctl button:focus-visible { outline: 2px solid var(--accent); }
#zoomctl .pct { min-width: 52px; font-variant-numeric: tabular-nums; color: var(--muted); }
.node {
  position: absolute; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 12px;
  background: var(--panel); cursor: pointer; box-shadow: var(--shadow); transition: opacity .2s, border-color .2s;
}
.node:hover { border-color: var(--accent); }
.node.cond { border-style: dashed; border-color: var(--dyn); }
.node.skipped { border-color: var(--skip); background: transparent; box-shadow: none; }
.node.skipped > b, .node.skipped > span, .node.skipped > .badge { opacity: .5; filter: grayscale(1); }
.node.selected { box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow); border-color: var(--accent); }
.node b { display: block; font-size: 13px; padding-right: 54px; overflow-wrap: anywhere; }
.node > span { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.badge { position: absolute; top: 9px; right: 10px; font-size: 10px; font-weight: 700; padding: 0 6px; border-radius: 999px; font-style: normal; }
.badge.join { background: var(--par-soft); color: var(--par); }
.badge.dyn { background: var(--dyn-soft); color: var(--dyn); }
.badge.skip { background: var(--bg); color: var(--muted); }
.ctl { margin-top: 8px; padding-top: 6px; border-top: 1px dashed var(--line); }
.ctl label { display: block; overflow-wrap: anywhere; font-size: 11px; font-weight: 700; color: var(--dyn); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 3px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button { font: inherit; font-size: 12px; padding: 1px 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--dyn); border-color: var(--dyn); color: #fff; }
.seg button:focus-visible, .node:focus-visible, .close:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 12px; margin: 0 4px 4px 0; }
.lane { position: absolute; border: 1.5px dashed var(--par); border-radius: 16px; background: var(--par-soft); opacity: .55; }
.lane-label { position: absolute; font-size: 11px; font-weight: 700; color: var(--par); }
.lane.main { border-color: var(--accent); background: var(--accent-soft); opacity: .4; }
.lane-label.main { color: var(--accent); }
.outcard {
  position: absolute; padding: 10px 12px; border: 1.5px solid var(--out); border-radius: 12px; background: var(--out-soft);
  box-shadow: var(--shadow);
}
.outcard h3 { margin: 0; font-size: 13px; }
.outcard .kind { font-size: 11px; color: var(--out); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.outcard p { margin: 2px 0 4px; color: var(--muted); font-size: 12px; }
.outcard ul { list-style: none; margin: 4px 0 0; padding: 0; }
.outcard li { padding: 1px 0 1px 20px; position: relative; font-size: 13px; }
.outcard li::before { content: "☑"; position: absolute; left: 0; color: var(--ok); }
.outcard li.off { color: var(--muted); text-decoration: line-through; opacity: .6; }
.outcard li.off::before { content: "–"; color: var(--skip); }
.bar { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.strip { position: absolute; left: 16px; top: 8px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; z-index: 1; }
.strip .ctl { margin: 0; padding: 4px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
#sheet {
  position: fixed; top: 0; right: 0; height: 100%; width: min(440px, 100%); background: var(--panel);
  border-left: 1px solid var(--line); box-shadow: var(--shadow); padding: 0; overflow: hidden; display: flex; flex-direction: column;
  transform: translateX(105%); transition: transform .2s ease; z-index: 10;
}
#sheet.open { transform: none; }
#sheetBody { flex: 1; min-height: 0; overflow: auto; padding: 0 16px 16px; }
#sheet h2 { position: sticky; top: 0; z-index: 2; margin: 0 -16px 4px; padding: 16px 48px 10px 16px; font-size: 18px; background: var(--panel); border-bottom: 1px solid var(--line); }
.hint { color: var(--muted); font-size: 12px; }
.close { position: absolute; z-index: 3; top: 10px; right: 12px; border: 0; background: none; color: var(--muted); font-size: 22px; cursor: pointer; }
.status { padding: 6px 10px; border-radius: 8px; margin: 8px 0 12px; font-size: 13px; background: var(--accent-soft); }
.status.skipped { background: var(--bg); color: var(--muted); }
.detail code { background: var(--bg); padding: 0 4px; border-radius: 4px; }
.detail ul { padding-left: 20px; }
.row { margin: 8px 0; }
.row small { display: block; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-size: 11px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="banner" role="alert"></div>
<header>
  <h1 id="title">Skill</h1>
  <p id="desc"></p>
  <div class="legend">
    <span>Solid: always runs</span><span style="color:var(--dyn)">Dashed: conditional (use its toggle)</span>
    <span style="color:var(--accent)">Blue lane: main agent</span><span style="color:var(--par)">Orange lane: parallel</span><span>Faded: skipped</span><span style="color:var(--out)">Teal: outputs</span><span>Drag to pan, Ctrl+scroll or pinch to zoom, Shift-click cards to select several</span>
  </div>
  <div id="agentbar">
    <span class="hint" id="sigmsg" aria-live="polite"></span>
    <span class="pill" id="status" data-s="draft">draft</span>
    <button type="button" class="act ghost" id="changesBtn" hidden>Request changes</button>
    <button type="button" class="act" id="readyBtn">Ready for agent</button>
  </div>
</header>
<div id="stage">
  <div id="board"><div id="world"><div class="strip" id="strip"></div><div id="chart"></div></div></div>
  <div id="topbars">
  <div id="revbar" role="group" aria-label="Agent changes" hidden>
    <span id="revmsg"></span>
    <button type="button" class="act" id="revOpen">Review changes</button>
    <button type="button" class="act ghost" id="revAccept">Accept all</button>
    <button type="button" class="act ghost" id="revReject">Reject all</button>
  </div>
  <div id="selbar" role="group" aria-label="Selected steps" hidden>
    <span id="selmsg"></span>
    <button type="button" class="act" id="parBtn">Make parallel</button>
    <button type="button" class="act ghost" id="joinBtn">Add join</button>
    <button type="button" class="act ghost" id="selClear">Clear</button>
  </div>
  </div>
  <div id="edittools" role="group" aria-label="Edit tools" hidden>
    <button type="button" id="addStep" title="Add a step (connects after the selected step)">+ Step</button>
    <button type="button" id="inputsBtn" title="Manage inputs and their toggles">Inputs</button>
    <button type="button" id="chatBtn" title="Hand the plan to an assistant in a chat window, and paste its reply back">Chat agent</button>
    <button type="button" id="filesBtn" title="Choose where the finished skill is written and watch the files appear">Files</button>
    <button type="button" id="undoBtn" title="Undo (Ctrl+Z)">Undo</button>
    <button type="button" id="redoBtn" title="Redo (Ctrl+Shift+Z)">Redo</button>
    <button type="button" id="relayoutBtn" title="Forget dragged positions and auto-arrange">Re-layout</button>
    <span class="hint" id="flash" aria-live="polite"></span>
  </div>
  <div id="zoomctl" role="group" aria-label="View controls">
    <button type="button" id="zout" aria-label="Zoom out" title="Zoom out (-)">−</button>
    <button type="button" id="zpct" class="pct" aria-label="Reset zoom to 100%" title="Reset to 100% (1)">100%</button>
    <button type="button" id="zin" aria-label="Zoom in" title="Zoom in (+)">+</button>
    <button type="button" id="zfit" aria-label="Fit to screen" title="Fit to screen (0)">Fit</button>
  </div>
</div>
<aside id="sheet" aria-label="Step details" aria-hidden="true">
  <button class="close" id="close" aria-label="Close details">×</button>
  <div id="sheetBody"></div>
</aside>

<script>
/*CORE-START*/
// Pure logic for the skill-builder visualizer. No DOM access, so it runs in the
// browser (window.SkillCore) and in node (require) for tests.
(function (root) {
  function checkCond(cond, sel) {
    if (!cond) return true;
    if (cond.all) return cond.all.every((c) => checkCond(c, sel));
    if (cond.any) return cond.any.some((c) => checkCond(c, sel));
    const v = sel[cond.input];
    if ('is' in cond) return v === cond.is;
    if ('isNot' in cond) return v !== cond.isNot;
    if ('in' in cond) return cond.in.includes(v);
    return true;
  }

  function describeCond(cond) {
    if (!cond) return '';
    if (cond.all) return cond.all.map(describeCond).join(' and ');
    if (cond.any) return cond.any.map(describeCond).join(' or ');
    if ('is' in cond) return `${cond.input} is ${cond.is}`;
    if ('isNot' in cond) return `${cond.input} is not ${cond.isNot}`;
    if ('in' in cond) return `${cond.input} is one of ${cond.in.join(', ')}`;
    return '';
  }

  function defaultSelections(spec) {
    const sel = {};
    for (const i of spec.inputs || []) {
      if (i.kind === 'dynamic' && i.options && i.options.length) {
        sel[i.id] = i.default !== undefined ? i.default : i.options[0].id;
      }
    }
    return sel;
  }

  // Layer = longest dependency chain to a root. Throws on unknown deps or cycles.
  function layers(spec) {
    const steps = spec.steps || [];
    const byId = new Map(steps.map((s) => [s.id, s]));
    const depth = new Map();
    const visiting = new Set();
    function d(id) {
      if (depth.has(id)) return depth.get(id);
      if (visiting.has(id)) throw new Error(`Cycle in dependsOn at step "${id}"`);
      const s = byId.get(id);
      if (!s) throw new Error(`Unknown step "${id}" in dependsOn`);
      visiting.add(id);
      const deps = s.dependsOn || [];
      const v = deps.length ? 1 + Math.max(...deps.map(d)) : 0;
      visiting.delete(id);
      depth.set(id, v);
      return v;
    }
    steps.forEach((s) => d(s.id));
    return depth;
  }

  // Returns Map(stepId -> {active, reason}). A step is skipped when its own
  // runWhen fails, or when it has dependencies and every one of them is skipped.
  // A join therefore still runs if any branch feeding it is active.
  function evaluate(spec, sel) {
    const depth = layers(spec);
    const ordered = [...(spec.steps || [])].sort((a, b) => depth.get(a.id) - depth.get(b.id));
    const res = new Map();
    for (const s of ordered) {
      if (!checkCond(s.runWhen, sel)) {
        res.set(s.id, { active: false, reason: `Needs ${describeCond(s.runWhen)}` });
        continue;
      }
      const deps = s.dependsOn || [];
      if (deps.length && deps.every((id) => !res.get(id).active)) {
        res.set(s.id, { active: false, reason: 'Everything upstream was skipped' });
        continue;
      }
      res.set(s.id, { active: true, reason: s.runWhen ? `Runs because ${describeCond(s.runWhen)}` : 'Always runs' });
    }
    return res;
  }

  function visibleItems(output, sel) {
    return (output.items || []).map((it) => {
      const text = typeof it === 'string' ? it : it.text;
      const when = typeof it === 'string' ? null : it.when;
      return { text, conditional: !!when, active: checkCond(when, sel), why: describeCond(when) };

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function md(src) {
  const inline = (t) => esc(t).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/`(.+?)`/g, '<code>$1</code>');
  return String(src || '').split(/\n\n+/).map((blk) => {
    const lines = blk.split('\n');
    if (lines.every((l) => /^\s*[-*] /.test(l))) return '<ul>' + lines.map((l) => '<li>' + inline(l.replace(/^\s*[-*] /, '')) + '</li>').join('') + '</ul>';
    return '<p>' + inline(blk) + '</p>';
  }).join('');
}

function setBanner(msg) { const b = $('banner'); b.style.display = msg ? 'block' : 'none'; b.textContent = msg || ''; }

function mergeSelections(next) {
  const d = C.defaultSelections(next), out = {};
  for (const i of next.inputs || []) {
    if (i.kind !== 'dynamic') continue;
    out[i.id] = (i.options || []).some((o) => o.id === sel[i.id]) ? sel[i.id] : d[i.id];
  }
  return out;
}

// Input ids referenced by a condition (runWhen / when).
function condInputs(c, acc = []) {
  if (!c) return acc;
  if (c.all) c.all.forEach((x) => condInputs(x, acc));
  else if (c.any) c.any.forEach((x) => condInputs(x, acc));
  else if (c.input && !acc.includes(c.input)) acc.push(c.input);
  return acc;
}
const dynInput = (id) => (spec.inputs || []).find((i) => i.id === id && i.kind === 'dynamic');
const stepToggles = (s) => condInputs(s.runWhen).map(dynInput).filter(Boolean);

function toggleHTML(inp) {
  return `<div class="ctl"><label>${esc(inp.label || inp.id)}</label><div class="seg" role="group" aria-label="${esc(inp.label || inp.id)}">` +
    (inp.options || []).map((o) => `<button type="button" data-input="${esc(inp.id)}" data-opt="${esc(o.id)}" aria-pressed="${sel[inp.id] === o.id}">${esc(o.label || o.id)}</button>`).join('') +
    '</div></div>';
}

function nodeInner(s, e, rop, issues) {
  const isJoin = (s.dependsOn || []).length > 1;
  const badge = !e.active ? '<i class="badge skip">SKIPPED</i>' : isJoin ? '<i class="badge join">JOIN</i>' : s.runWhen ? '<i class="badge dyn">IF</i>' : '';
  return `<i class="port in"></i><i class="port out"></i>${rop ? `<i class="rbadge ${rop}">${rop === 'added' ? 'NEW' : 'CHANGED'}</i>` : ''}${badge}<b>${esc(s.title || s.id)}${s.userNote ? ' \u270E' : ''}${issues.some((i) => i.steps.includes(s.id)) ? ' \u26A0' : ''}</b><span>${esc(s.summary)}</span>${stepToggles(s).map(toggleHTML).join('')}`;
}

function renderBoard() {
  const ev = C.evaluate(spec, sel), steps = spec.steps || [], chart = $('chart');
  for (const id of [...multi]) if (!steps.some((s) => s.id === id)) multi.delete(id);
  const issues = [...C.parallelIssues(spec), ...C.ioIssues(spec)];
  const reviewOps = new Map(review().filter((c) => c.kind === 'step' && c.op !== 'removed').map((c) => [c.key, c.op]));
  const reviewOpOf = (s) => reviewOps.get(s.id);
  // Measure each card with its real content, so long titles and toggle labels never spill out of it.
  const meas = document.createElement('div');
  meas.style.cssText = 'position:absolute;left:-99999px;top:0;visibility:hidden';
  meas.innerHTML = steps.map((s) => `<div class="node${s.runWhen ? ' cond' : ''}" style="position:relative;width:${CARD_W}px">${nodeInner(s, ev.get(s.id), reviewOpOf(s), issues)}</div>`).join('');
  document.body.appendChild(meas);
  const measured = new Map(steps.map((s, i) => [s.id, Math.ceil(meas.children[i].getBoundingClientRect().height)]));
  meas.remove();
  const hOf = (s) => Math.max(BASE_H, measured.get(s.id) || 0);
  const L = C.layout(spec, { w: CARD_W, hOf, gx: 80, gy: 30 });
  lastLayout = L;

  // Inputs that gate nothing still need a toggle: put them in a strip above the board.
  const used = new Set(steps.flatMap((s) => condInputs(s.runWhen)));
  const loose = (spec.inputs || []).filter((i) => i.kind === 'dynamic' && !used.has(i.id));
  const dataIn = (spec.inputs || []).filter((i) => i.kind !== 'dynamic');
  $('strip').innerHTML = loose.map(toggleHTML).join('') + (dataIn.length ? '<div class="bar"><span class="hint">Data inputs:</span>' + dataIn.map((i) => `<span class="chip">${esc(i.label || i.id)}</span>`).join('') + '</div>' : '');
  const stripH = $('strip').children.length ? $('strip').offsetHeight + 8 : 0;
  const top = stripH;

  // Output cards form a final column. Build them first and measure real heights so they never overlap.
  const outs = spec.outputs || [], outX = L.width + 10, outW = 270;
  chart.innerHTML = '';
  const outEls = outs.map((o) => {
    const items = C.visibleItems(o, sel);
    const shaped = (o.shapedBy || []).map((id) => `<span class="chip">${esc(id)}</span>`).join('');
    const el = document.createElement('div');
    el.className = 'outcard'; el.style.cssText = `left:${outX}px;top:0;width:${outW}px`;
    el.innerHTML = `<div class="kind">${o.kind === 'intermediate' ? 'Dynamic output (evolves)' : 'Final output'}</div><h3>${esc(o.label || o.id)}</h3><p>${esc(o.summary)}</p>` +
      (shaped ? `<div class="hint">Shaped by ${shaped}</div>` : '') +
      (items.length ? '<ul>' + items.map((i) => `<li class="${i.active ? '' : 'off'}" title="${esc(i.why)}">${esc(i.text)}</li>`).join('') + '</ul>' : '');
    chart.appendChild(el);
    return el;
  });
  let oy = 24;
  const outBoxes = outs.map((o, i) => { const h = outEls[i].offsetHeight, b = { o, x: outX, y: oy, w: outW, h }; outEls[i].style.top = oy + top + 'px'; oy += h + 20; return b; });
  const width = outs.length ? outX + outW + 40 : L.width;
  const height = Math.max(L.height, oy + 10) + top;
  chart.style.width = width + 'px'; chart.style.height = height + 'px';
  content = { w: width, h: height };

  const sinks = steps.filter((s) => !steps.some((t) => (t.dependsOn || []).includes(s.id)));
  let svg = `<svg width="${width}" height="${height}"><defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8z" fill="currentColor"/></marker></defs>`;
  // Obstacles for connectors: every lane and output card except the ones the two ends sit in. Inside a shared
  // parallel lane, the other cards in it still count.
  const groupOf = new Map();
  for (const g of L.groups) for (const st of steps) if (st.parallelGroup === g.name) groupOf.set(st.id, g);
  const obstaclesFor = (fromId, toId, toBox) => {
    const ends = new Set([fromId, toId]), out = [];
    for (const m of L.mains) if (!ends.has(m.id)) out.push(m);
    for (const g of L.groups) {
      const mine = [...ends].some((id) => groupOf.get(id) === g);
      if (!mine) { out.push(g); continue; }
      for (const st of steps) if (groupOf.get(st.id) === g && !ends.has(st.id)) { const n = L.nodes.get(st.id); out.push({ x: n.x - 4, y: n.y - 4, w: n.w + 8, h: n.h + 8 }); }
    }
    for (const ob of outBoxes) if (ob !== toBox) out.push(ob);
    return out;
  };
  const edge = (a, b, live, cls, ids, obs) => {
    const pts = C.routeEdge(a, b, obs).map(([x, y]) => [x, y + top]);
    pts[pts.length - 1][0] -= 2; // leave room for the arrow head so it touches the card
    const d = 'M' + pts.map((p) => p.join(',')).join(' L');
    const k = Math.floor(pts.length / 2), dx = (pts[k - 1][0] + pts[k][0]) / 2, dy = (pts[k - 1][1] + pts[k][1]) / 2;
    const col = cls || (live ? 'var(--accent)' : 'var(--skip)');
    return `<g class="edge"><path d="${d}" fill="none" stroke="${col}" style="color:${col}" stroke-width="${live ? 2 : 1.2}" stroke-dasharray="${live ? '' : '4 4'}" stroke-linejoin="round" marker-end="url(#ar)"/>` +
      (ids && EDIT ? `<path class="edge-hit" d="${d}"/><g class="edel" data-from="${esc(ids[0])}" data-to="${esc(ids[1])}" transform="translate(${dx},${dy})"><title>Remove this connection</title><circle r="10"/><text y="5" text-anchor="middle">\u00d7</text></g>` : '') + '</g>';
  };
  for (const s of steps) for (const dep of s.dependsOn || []) svg += edge(L.nodes.get(dep), L.nodes.get(s.id), ev.get(dep).active && ev.get(s.id).active, null, [dep, s.id], obstaclesFor(dep, s.id));
  if (conn && L.nodes.get(conn.from)) { const a = L.nodes.get(conn.from); svg += `<path d="M${a.x + a.w},${a.y + a.h / 2 + top} L${conn.x},${conn.y}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 4"/>`; }
  for (const b of outBoxes) if (b.o.kind === 'final') for (const s of sinks) svg += edge(L.nodes.get(s.id), { x: b.x, y: b.y, w: b.w, h: b.h }, ev.get(s.id).active, 'var(--out)', null, obstaclesFor(s.id, null, b));
  chart.insertAdjacentHTML('afterbegin', svg + '</svg>');

  for (const m of L.mains) chart.insertAdjacentHTML('beforeend', `<div class="lane main" style="left:${m.x}px;top:${m.y + top}px;width:${m.w}px;height:${m.h}px"></div><div class="lane-label main" style="left:${m.x + 10}px;top:${m.y + top + 5}px">MAIN AGENT</div>`);
  for (const g of L.groups) chart.insertAdjacentHTML('beforeend', `<div class="lane" style="left:${g.x}px;top:${g.y + top}px;width:${g.w}px;height:${g.h}px"></div><div class="lane-label${issues.some((i) => i.group === g.name) ? ' bad' : ''}" style="left:${g.x + 10}px;top:${g.y + top + 5}px" title="${esc(issues.filter((i) => i.group === g.name).map((i) => i.message).join('\n'))}">PARALLEL: ${esc(g.name)}${issues.some((i) => i.group === g.name) ? ' \u26A0' : ''}</div>`);

  for (const s of steps) {
    const n = L.nodes.get(s.id), e = ev.get(s.id);
    const el = document.createElement('div');
    el.className = 'node' + (s.runWhen ? ' cond' : '') + (e.active ? '' : ' skipped') + (selectedStep === s.id ? ' selected' : '') + (multi.has(s.id) ? ' multi' : '');
    el.style.cssText = `left:${n.x}px;top:${n.y + top}px;width:${n.w}px;height:${n.h}px`;
    el.dataset.id = s.id; el.tabIndex = 0; el.setAttribute('role', 'button'); el.setAttribute('aria-label', `${s.title || s.id}, ${e.active ? 'runs' : 'skipped'}`);
    const rop = reviewOps.get(s.id);
    if (rop) el.classList.add('chg-' + rop);
    const mine = issues.filter((i) => i.steps.includes(s.id)), tips = [];
    if (s.userNote) tips.push('Note for agent: ' + s.userNote);
    mine.forEach((i) => tips.push('Warning: ' + i.message));
    if (tips.length) el.title = tips.join('\n');
    el.innerHTML = nodeInner(s, e, rop, issues);
    el.onclick = (ev) => { if (EDIT && (ev.shiftKey || ev.metaKey || ev.ctrlKey)) toggleMulti(s.id); else { multi.clear(); openSheet(s.id); } };
    el.onkeydown = (k) => { if (k.target === el && (k.key === 'Enter' || k.key === ' ')) { k.preventDefault(); openSheet(s.id); } };
    chart.appendChild(el);
  }

}

// One delegated handler for every toggle button, on cards or in the strip.
document.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-input]');
  if (!btn) return;
  e.stopPropagation();
  sel[btn.dataset.input] = btn.dataset.opt;
  renderAll();
}, true);

function openSheet(id) { stopFilesPoll(); selectedStep = id; sheetMode = 'step'; sheetUI.newInput = false; renderAll(); $('sheet').classList.add('open'); $('sheet').setAttribute('aria-hidden', 'false'); }
function closeSheet() { stopFilesPoll(); handoffUI.err = ''; selectedStep = null; sheetMode = 'step'; reviewUI.err = {}; sheetUI.newInput = false; panelUI.confirmDelete = null; panelUI.newInput = false; panelUI.err = {}; $('sheet').classList.remove('open'); $('sheet').setAttribute('aria-hidden', 'true'); renderAll(); }
$('close').onclick = closeSheet;
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && (selectedStep || sheetMode !== 'step')) closeSheet(); });

const sheetUI = { newInput: false };
let sheetMode = 'step'; // 'step' (edit the selected card) or 'inputs' (the inputs panel)
const panelUI = { confirmDelete: null, newInput: false, err: {} };
function renderSheet(ev) {
  if (sheetMode === 'inputs') { renderInputsPanel(); return; }
  if (sheetMode === 'review') { renderReviewPanel(); return; }
  if (sheetMode === 'files') { renderFilesPanel(); return; }
  if (sheetMode === 'handoff') { renderHandoffPanel(); return; }
  const s = (spec.steps || []).find((x) => x.id === selectedStep);
  if (!s) { $('sheet').classList.remove('open'); return; }
  const e = ev.get(s.id), title = (id) => ((spec.steps || []).find((x) => x.id === id) || {}).title || id;
  const chips = (arr) => (arr || []).map((x) => `<span class="chip">${esc(x)}</span>`).join('') || '<span class="hint">none</span>';
  const ioChip = (id) => { const a = (spec.artifacts || []).find((x) => x.id === id), i = (spec.inputs || []).find((x) => x.id === id);
    return `<span class="chip" title="${esc(a ? a.label || '' : i ? 'input' : 'not defined')}">${esc(a && a.path ? `${id} \u2192 ${a.path}${a.format ? ' (' + a.format + ')' : ''}` : i ? `${i.label || id} (input)` : id)}</span>`; };
  const ioRow = (label, arr, missing) => `<div class="row"><small>${label}</small>${Array.isArray(arr) ? arr.map(ioChip).join('') || '<span class="hint">nothing</span>' : `<span class="hint">${missing}</span>`}</div>`;
  const io = ioRow('Reads', s.reads, 'not defined yet') + ioRow('Produces', s.produces, 'not defined yet') +
    C.ioIssues(spec).filter((i) => i.steps.includes(s.id)).map((i) => `<div class="warn soft" role="note">${esc(i.message)}</div>`).join('');
  const rm = (d) => (EDIT ? ` <button type="button" class="chipx" data-rm="${esc(d)}" aria-label="Stop waiting for ${esc(title(d))}" title="Remove this connection">\u00d7</button>` : '');
  const waits = `<div class="row"><small>Waits for</small>${(s.dependsOn || []).map((d) => `<span class="chip">${esc(title(d))}${rm(d)}</span>`).join('') || '<span class="hint">nothing (starts the flow)</span>'}</div>`;
  const status = `<div class="status ${e.active ? '' : 'skipped'}">${e.active ? 'Runs.' : 'Skipped.'} ${esc(e.reason)}</div>`;
  if (!EDIT) {
    $('sheetBody').innerHTML = `<h2>${esc(s.title)}</h2><div class="hint">${esc(s.summary)}</div>${status}
      <div class="detail">${md(s.detail || '')}</div>${waits}
      ${s.parallelGroup ? `<div class="row"><small>Parallel group</small>${chips([s.parallelGroup])}</div>` : ''}
      ${io}`;
    return;
  }
  const dyn = (spec.inputs || []).filter((i) => i.kind === 'dynamic'), cl = C.toClauses(s.runWhen);
  const opLabel = { is: 'is', isNot: 'is not', in: 'is one of' };
  const opOf = (c) => (c.is !== undefined ? 'is' : c.isNot !== undefined ? 'isNot' : 'in');
  const clauseRow = (c, i) => {
    const known = (spec.inputs || []).find((x) => x.id === c.input), opts = (known && known.options) || [], op = opOf(c), val = c[op];
    const inputSel = `<select data-c="input" aria-label="Input">${dyn.map((x) => `<option value="${esc(x.id)}"${x.id === c.input ? ' selected' : ''}>${esc(x.label || x.id)}</option>`).join('')}${dyn.some((x) => x.id === c.input) ? '' : `<option value="${esc(c.input)}" selected>${esc(c.input)} (not a dynamic input)</option>`}</select>`;
    const opSel = `<select data-c="op" aria-label="Comparison">${['is', 'isNot', 'in'].map((k) => `<option value="${k}"${k === op ? ' selected' : ''}>${opLabel[k]}</option>`).join('')}</select>`;
    const value = op === 'in'
      ? `<div class="ckset">${opts.map((o) => `<label class="ck"><input type="checkbox" data-c="in" value="${esc(o.id)}"${val.includes(o.id) ? ' checked' : ''}> ${esc(o.label || o.id)}</label>`).join('')}</div><div class="ferr" role="alert" hidden>Pick at least one value.</div>`
      : `<select data-c="val" aria-label="Value">${opts.map((o) => `<option value="${esc(o.id)}"${val === o.id ? ' selected' : ''}>${esc(o.label || o.id)}</option>`).join('')}</select>`;
    return `<div class="clause" data-i="${i}">${inputSel}${opSel}${value}<button type="button" class="chipx" data-c="rm" aria-label="Remove this condition" title="Remove this condition">×</button></div>`;
  };
  const cond = cl === null
    ? `<div class="row"><small>Runs when (custom)</small>${esc(C.describeCond(s.runWhen))}<div class="hint">Too nested to edit here; an agent can refine it.</div><button type="button" class="act ghost" id="condClear">Clear</button></div>`
    : `<div class="row"><small>Runs when</small>${cl.clauses.length ? '' : '<span class="hint">Always. Add a condition to make this step optional.</span>'}</div>` +
      (cl.clauses.length > 1 ? `<label class="f">Match<select data-c="mode"><option value="all"${cl.mode === 'all' ? ' selected' : ''}>All of these</option><option value="any"${cl.mode === 'any' ? ' selected' : ''}>Any of these</option></select></label>` : '') +
      cl.clauses.map(clauseRow).join('') +
      `<div class="row"><button type="button" class="act ghost" id="addClause">+ Add condition</button> <button type="button" class="act ghost" id="newInputBtn">+ New input</button></div>`;
  const newIn = sheetUI.newInput ? newInputFormHTML('Create and use here') : '';
  $('sheetBody').innerHTML = `<h2>${esc(s.title || s.id)}</h2>${status}
    <label class="f">Title<input type="text" data-f="title" value="${esc(s.title)}"></label>
    <label class="f">What it does (short)<input type="text" data-f="summary" value="${esc(s.summary)}"></label>
    <label class="f">Note for the agent<textarea data-f="userNote" rows="2" placeholder="What you want here, in your own words">${esc(s.userNote)}</textarea></label>
    <label class="f">Details (markdown)<textarea data-f="detail" rows="6">${esc(s.detail)}</textarea></label>
    <label class="f">Parallel group<input type="text" data-f="parallelGroup" value="${esc(s.parallelGroup)}" placeholder="steps sharing a name run together"></label>
    ${C.parallelIssues(spec).filter((i) => i.steps.includes(s.id)).map((i) => `<div class="warn soft" role="note">${esc(i.message)}<br>${i.kind === 'nojoin' ? `<button type="button" class="act" data-par="join" data-group="${esc(i.group)}">Add a join step</button>` : i.kind === 'single' ? `<button type="button" class="act ghost" data-par="clear" data-group="${esc(i.group)}">Remove this group name</button>` : `<button type="button" class="act" data-par="align" data-group="${esc(i.group)}">Give them the same parents</button>`}</div>`).join('')}
    ${cond}${newIn}${waits}
    ${io}
    <div class="row"><button type="button" class="act danger" id="delStep">Delete step</button></div>`;
}

const slug = (x) => String(x).toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '') || 'x';
function uniq(base, used) { let id = base, n = 2; while (used.has(id)) id = base + '_' + n++; return id; }
const stepOf = (sp) => (sp.steps || []).find((x) => x.id === selectedStep);

function clearFieldError(inputId) { const i = $(inputId), m = $(inputId + 'Err'); if (i) i.removeAttribute('aria-invalid'); if (m) m.hidden = true; }
$('sheetBody').addEventListener('input', (e) => {
  if (e.target.id === 'niLabel' || e.target.id === 'niOpts') { clearFieldError(e.target.id); return; }
  if (sheetMode !== 'step') return;
  const f = e.target.dataset.f; if (!f || !EDIT) return;
  const id = selectedStep, v = e.target.value;
  mutate((sp) => { const s = stepOf(sp); if (!s) return; if (v === '' && f !== 'title') delete s[f]; else s[f] = v; }, { key: id + '.' + f, sheet: false });
});
function newInputFormHTML(cta, withType) {
  return `<div class="newin"><b>New ${withType ? 'input' : 'dynamic input'}</b>
    <label class="f">Name<input type="text" id="niLabel" placeholder="e.g. Review depth" aria-describedby="niLabelErr"></label>
    <div class="ferr" id="niLabelErr" role="alert" hidden></div>
    ${withType ? '<label class="f">Type<select id="niKind"><option value="dynamic">Dynamic: changes which steps run</option><option value="data">Data: information the steps work on</option></select></label>' : ''}
    <div id="niOptsWrap"><label class="f">Options (comma separated, at least 2)<input type="text" id="niOpts" placeholder="e.g. Quick, Full" aria-describedby="niOptsErr"></label>
    <div class="ferr" id="niOptsErr" role="alert" hidden></div></div>
    <button type="button" class="act" id="niCreate">${cta}</button><button type="button" class="act ghost" id="niCancel">Cancel</button></div>`;
}
// Validates the new-input form inline. Returns {label, names} or null (errors shown next to the fields).
function readNewInput() {
  const kindEl = $('niKind'), isData = !!kindEl && kindEl.value === 'data';
  const label = $('niLabel').value.trim(), names = $('niOpts').value.split(',').map((x) => x.trim()).filter(Boolean);
  const bad = (inputId, msg) => { const i = $(inputId), m = $(inputId + 'Err'); i.setAttribute('aria-invalid', 'true'); m.textContent = msg; m.hidden = false; };
  ['niLabel', 'niOpts'].forEach(clearFieldError);
  if (!label) bad('niLabel', 'Enter a name for this input.');
  if (!isData && names.length < 2) bad('niOpts', 'Add at least two options, separated by commas.');
  if (!label || (!isData && names.length < 2)) { (!label ? $('niLabel') : $('niOpts')).focus(); return null; }
  return { label, names: isData ? [] : names, isData };
}
function addDynamicInput(sp, label, names) { // returns the new input
  sp.inputs = sp.inputs || [];
  const iid = uniq(slug(label), new Set(sp.inputs.map((i) => i.id))), used = new Set();
  const options = names.map((n) => { const oid = uniq(slug(n), used); used.add(oid); return { id: oid, label: n }; });
  const inp = { id: iid, label, kind: 'dynamic', options, default: options[0].id };
  sp.inputs.push(inp); return inp;
}

const clauseIndex = (el) => { const r = el.closest('.clause'); return r ? Number(r.dataset.i) : -1; };
const firstOpt = (sp, inputId) => (((sp.inputs || []).find((i) => i.id === inputId) || {}).options || [{}])[0].id;
function editClauses(fn) { // edit the selected step's condition as a flat list of clauses
  mutate((sp) => {

      lastText = text;
      const next = JSON.parse(text);
      C.layers(next); // validates dependsOn before we commit to rendering
      lastHash = r.headers.get('X-Spec-Hash');
      spec = next; sel = mergeSelections(spec); setBanner('');
      undoStack = []; redoStack = []; // history belongs to the version the user was editing
      renderAll();
      if (reloadNote) { reloadNote = false; flash('Your last edit was not saved: an agent or another editor changed the file. Reloaded it.', 9000); }
    }
  } catch (err) {
    if (IS_HTTP) setBanner('Spec problem (showing last good version): ' + err.message);
    else if (!spec) {
      spec = JSON.parse($('fallback-spec').textContent); sel = mergeSelections(spec); renderAll();
      setBanner('Static preview of the example spec. For live updates open http://localhost:8765/template.html (run scripts/start.sh).');
    }
  }
  setTimeout(poll, POLL_MS);
}
poll();
</script>
